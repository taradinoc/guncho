services:
  guncho:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guncho-server
    ports:
      # Web server (ASP.NET Core Kestrel with Blazor UI)
      - "5000:5000"
      # TCP server (telnet/MUD protocol for game connections)
      - "4108:4108"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_MODIFIABLE_ASSEMBLIES=
      - ConnectionStrings__GunchoDatabase=Data Source=/app/RealmData/guncho.db
      - Guncho__CachePath=/app/Cache
      - Guncho__RealmDataPath=/app/RealmData
      - Guncho__LogPath=/app/Logs
      - Guncho__NiInstallationsPath=/app/Factories/Inform7
      - Guncho__NiSkeletonPath=/app/Factories/Inform7/Skeleton.inform
      # Configurable ports (uncomment and modify to override defaults)
      # - Guncho__GameServerPort=4108
      # Note: WebServerPort (5000) is configured in Program.cs Kestrel settings
    volumes:
      # Persist game data and database
      - guncho-realmdata:/app/RealmData
      - guncho-cache:/app/Cache
      - guncho-logs:/app/Logs
      # Optionally mount RealmData for live editing
      # - ./RealmData:/app/RealmData
    restart: unless-stopped
    networks:
      - guncho-network

networks:
  guncho-network:
    driver: bridge

volumes:
  guncho-realmdata:
  guncho-cache:
  guncho-logs:
